<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Clausula Assistent</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assistent-core.js"></script>
  <script type="module">
    import { bouwAnonMap, anonimiseerTekst } from '/src/naam-anonimiseer.js';
    import { piiAnonimiseer }               from '/src/pii-anonimiseer.js';
    import { leesAntwoord }                 from '/src/api-antwoord.js';
    import { leesStroom }                   from '/src/assistent/sse-stroom.js';
    window.bouwAnonMap      = bouwAnonMap;
    window.anonimiseerTekst = anonimiseerTekst;
    window.piiAnonimiseer   = piiAnonimiseer;
    window.leesAntwoord     = leesAntwoord;
    window.leesStroom       = leesStroom;
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:    #FFFFFF;
      --bg:       #F3EFE9;
      --ink:      #1A1816;
      --ink-mid:  #443E38;
      --ink-soft: #7A7068;
      --muted:    #9C8F7E;
      --line:     #E3DCD5;
      --nav-bg:   #1B3050;
      --nav-border:#243F68;
      --ok:       #2A7260;
      --coral:    #E56038;
      --status-risico:   #B91C1C;
      --status-aandacht: #854D0E;
      --status-ok:       #2E7D32;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    /* ── Layout ── */
    .mob-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 560px;
      /* Left-aligned: no auto margins */
    }

    /* ── Header ── */
    /* ── Header — identiek aan desktop assist-hdr ── */
    .mob-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 56px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .mob-hdr-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--nav-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .85rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .mob-hdr-brand { flex: 1; min-width: 0; }
    .mob-hdr-title {
      font-weight: 700;
      font-size: .9rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mob-hdr-sub {
      font-size: .68rem;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mob-hdr-actions { display: flex; gap: 4px; }
    .mob-hdr-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(27,48,80,.07);
      color: var(--ink-soft);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .13s, color .13s;
    }
    .mob-hdr-btn:hover { background: rgba(27,48,80,.14); color: var(--ink); }
    .mob-back-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(27,48,80,.07);
      color: var(--ink-soft);
      font-size: .72rem;
      font-weight: 600;
      text-decoration: none;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      transition: background .13s, color .13s;
    }
    .mob-back-btn:hover { background: rgba(27,48,80,.14); color: var(--ink); }

    /* ── Disclaimer strip ── */
    .mob-disclaimer {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px;
      background: #FEF9F0;
      border-bottom: 1px solid #F0E8CC;
      font-size: .72rem;
      color: #7A5F2A;
      line-height: 1.4;
    }
    .mob-disclaimer svg { flex-shrink: 0; margin-top: 1px; }

    /* ── Auth overlay ── */
    #mobAuthOverlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      padding: 32px 20px;
      text-align: center;
    }
    #mobAuthOverlay p { color: var(--ink-soft); font-size: .88rem; }

    /* ── Messages ── */
    .mob-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    /* Bubbles */
    .mob-bubble-wrap { display: flex; flex-direction: column; max-width: 82%; }
    .mob-bubble-wrap.user { align-self: flex-end; align-items: flex-end; }
    .mob-bubble-wrap.assist { align-self: flex-start; align-items: flex-start; }

    .mob-bubble {
      font-size: .83rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .mob-bubble.user {
      background: var(--nav-bg);
      color: #fff;
      border-radius: 12px 12px 3px 12px;
      padding: 10px 13px;
    }
    .mob-bubble.assist {
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 3px 12px 12px 12px;
      padding: 11px 14px;
    }
    .mob-bubble.assist.heeft-secties { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; }
    .mob-bubble h2, .mob-bubble h3 {
      font-size: .82rem;
      font-weight: 700;
      margin: .7em 0 .3em;
    }
    .mob-bubble h2:first-child, .mob-bubble h3:first-child { margin-top: 0; }
    .mob-bubble strong { font-weight: 700; }
    .mob-bubble p { margin: 0 0 .5em; }
    .mob-bubble p:last-child { margin-bottom: 0; }
    .mob-bubble ul, .mob-bubble ol { padding-left: 1.2em; margin: .3em 0; }
    .mob-bubble li { margin-bottom: .25em; }
    .mob-bubble code { font-family:'IBM Plex Mono',monospace; font-size:.78em; background:rgba(0,0,0,.05); padding:1px 4px; border-radius:3px; }
    .mob-bubble hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }

    /* Voortgang tijdens het streamen — zie de toelichting in index.html */
    .mob-stream-rest:empty { display: none; }
    .mob-stream-rest {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      margin-top: 10px; padding-top: 8px;
      border-top: 1px dashed var(--line);
    }
    .mob-stream-lbl { font-size: .68rem; color: var(--ink-soft); margin-right: 2px; }
    /* Geen pulserende puntjes meer: de chips ernaast tonen al welk onderdeel
       nog onderweg is. Twee animaties voor één boodschap. */
    .mob-stream-lbl::after { content: '…'; }
    .mob-stream-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 8px; border: 1px solid var(--line); border-radius: 12px;
      font-size: .68rem; color: var(--ink-soft); background: var(--paper);
      opacity: .55; transition: opacity .25s, color .25s, border-color .25s;
    }
    .mob-stream-chip.klaar { opacity: 1; color: var(--ink-mid); border-color: var(--ink-soft); }
    .mob-stream-chip.klaar::before { content: '✓'; font-size: .62rem; color: #1E8449; }

    /* Thinking indicator */
    .mob-thinking {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 3px 12px 12px 12px;
      font-size: .8rem;
      color: var(--ink-soft);
    }
    .mob-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      animation: laad-stuit .9s ease-in-out infinite;
    }
    .mob-dot:nth-child(2) { animation-delay: .2s; }
    .mob-dot:nth-child(3) { animation-delay: .4s; }
    /* Dezelfde naam en dezelfde waarden als in index.html — mobiel had hier een
       eigen kopie onder een andere naam. Wijzigt de vorm daar, wijzig hem hier ook. */
    @keyframes laad-stuit {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mob-dot { animation: none; }
    }

    /* Bronnen chips (gedeeld door mob-bronnen-chips en eventuele directe weergave) */
    .mob-bron {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: .7rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--ink-mid);
      max-width: 100%;
      overflow: hidden;
    }
    .mob-bron a { color: inherit; text-decoration: none; }
    .mob-bron a:hover { color: var(--nav-bg); border-color: var(--nav-bg); }

    /* Kopieer button */
    .mob-copy-btn {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 6px;
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--muted);
      font-size: .75rem;
      font-family: inherit;
      cursor: pointer;
      transition: all .13s;
    }
    .mob-copy-btn:hover { border-color: var(--nav-bg); color: var(--nav-bg); }
    .mob-copy-btn.gekopieerd { color: var(--ok); border-color: var(--ok); }

    /* Keuze-blokken per vraag */
    .mob-vraag-blok {
      margin-top: 10px;
      padding: 7px 10px;
      border-left: 3px solid var(--nav-bg);
      background: rgba(27,48,80,.04);
      border-radius: 0 6px 6px 0;
    }
    .mob-vraag-label { font-size: .7rem; font-weight: 700; color: var(--ink-mid); margin-bottom: 6px; }
    .mob-keuzes { display: flex; flex-wrap: wrap; gap: 6px; }
    .mob-keuze-btn {
      background: none;
      border: 1.5px solid var(--nav-bg);
      border-radius: 14px;
      padding: 4px 12px;
      font-size: .72rem;
      font-family: inherit;
      color: var(--nav-bg);
      cursor: pointer;
      transition: background .13s;
    }
    .mob-keuze-btn:hover { background: rgba(27,48,80,.08); }
    .mob-keuze-btn.geselecteerd { background: var(--nav-bg); color: #fff; }
    .mob-vraag-blok.inactief { opacity: .45; pointer-events: none; }
    .mob-na-advies-knoppen { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
    .mob-actie-btn { padding: 6px 12px; border: 1.5px solid var(--nav-bg);
      border-radius: 6px; background: transparent; color: var(--nav-bg);
      font-size: .78rem; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: all .13s; }
    .mob-actie-btn:hover { background: var(--nav-bg); color: #fff; }

    /* ── Input area ── */
    .mob-input-area {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 14px;
      background: var(--paper);
      border-top: 1px solid var(--line);
    }
    .mob-invoer-rij {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .mob-input {
      flex: 1;
      min-height: 38px;
      max-height: 120px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      font-family: 'Inter', sans-serif;
      font-size: .83rem;
      color: var(--ink);
      resize: none;
      line-height: 1.45;
      outline: none;
      transition: border-color .13s;
      overflow-y: auto;
    }
    .mob-input:focus {
      border-color: var(--nav-bg);
    }
    .mob-input::placeholder { color: var(--muted); }
    .mob-send {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--nav-bg);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .13s;
    }
    .mob-send:hover:not(:disabled) { opacity: .85; }
    .mob-send:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Opties-kaartjes ── */
    .mob-opties-wrap { display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }
    .mob-optie-kaart {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
    }
    .mob-optie-titel { font-weight: 700; font-size: .82rem; color: var(--ink); margin-bottom: 4px; }
    .mob-optie-kern { font-size: .79rem; color: var(--ink-mid); line-height: 1.45; margin-bottom: 0; }
    .mob-optie-afwegingen {
      font-size: .75rem; color: var(--ink-soft); line-height: 1.4;
      border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px;
    }

    /* ── Secties binnen de bubble (Signalen / Aannames / Onbekenden) ── */
    .mob-meta-hdr {
      display: flex; align-items: center; gap: 5px;
      width: 100%; border: none; padding: 4px 8px; border-radius: 6px;
      background: rgba(27,48,80,.08); color: var(--ink-mid);
      font-size: .71rem; font-weight: 700; cursor: pointer;
      font-family: inherit; text-align: left; margin-top: 6px;
      line-height: 1.4; transition: filter .12s; user-select: none;
    }
    .mob-meta-hdr:hover { filter: brightness(.93); }
    .mob-meta-hdr .meta-arrow { font-style: normal; font-size: .65rem; transition: transform .15s; flex-shrink: 0; }
    .mob-meta-hdr.sig-hoog { background: #FEE2E2; color: var(--status-risico); }
    .mob-meta-hdr.sig-midden { background: #FEF9C3; color: var(--status-aandacht); }
    .mob-meta-body { display: none; padding: 5px 10px 6px 22px; font-size: .78rem; line-height: 1.5; color: var(--ink-mid); }
    .mob-meta-body.open { display: block; }
    .mob-meta-body ul { list-style: none; padding: 0; margin: 0; }
    .mob-meta-body li { margin-bottom: 2px; }
    .mob-sig-hoog { color: var(--status-risico); font-weight: 600; }
    .mob-sig-midden { color: var(--status-aandacht); font-weight: 600; }
    .mob-sig-laag { color: var(--status-ok); }

    /* Bronnen toggle (zoals desktop assist-bronnen-toggle) */
    .mob-bronnen-toggle {
      display: flex; align-items: center; gap: 5px;
      border: none; background: none; padding: 9px 0 0;
      font-size: .67rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--ink-soft);
      cursor: pointer; font-family: inherit;
      border-top: 1px solid var(--line); width: 100%; text-align: left;
      margin-top: 9px;
    }
    .mob-bronnen-toggle .meta-arrow { font-style: normal; transition: transform .15s; }
    .mob-bronnen-chips { display: none; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .mob-bronnen-chips.open { display: flex; }

    /* ── Vervolgactie-knoppen (onder de kaart, zoals desktop) ── */
    .mob-vervolgacties {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
    }
    .mob-vervolgactie-btn {
      padding: 4px 12px; border-radius: 16px;
      border: 1.5px solid var(--nav-bg); background: transparent;
      color: var(--nav-bg); font-size: .74rem; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
      transition: all .13s;
    }
    .mob-vervolgactie-btn:hover { background: var(--nav-bg); color: #fff; }
    .mob-vervolgactie-btn:disabled { opacity: .4; cursor: default; pointer-events: none; }

    /* ── Dossier indicator balk ── */
    .mob-dossier-balk {
      flex-shrink: 0;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #EEF4FF;
      border-bottom: 1px solid #C8D8F8;
      font-size: .72rem;
      color: #1E3A7A;
    }
    .mob-dossier-balk-ico { flex-shrink: 0; }
    .mob-dossier-balk-label { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mob-dossier-balk-x {
      flex-shrink: 0; border: none; background: transparent; color: #1E3A7A;
      cursor: pointer; font-size: .85rem; padding: 2px 5px; opacity: .55;
    }
    .mob-dossier-balk-x:hover { opacity: 1; }

    /* ── Actie-balk (4 commando-chips, identiek aan desktop) ── */
    .mob-actie-balk {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 0 9px; border-bottom: 1px solid var(--line); margin-bottom: 9px;
    }
    .mob-actie-cmd {
      flex: 1; padding: 5px 6px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--paper);
      color: var(--ink-soft); font-size: .71rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
      line-height: 1.25; text-align: center;
    }
    .mob-actie-cmd:hover:not(:disabled) { border-color: var(--nav-bg); color: var(--nav-bg); background: rgba(27,48,80,.06); }
    .mob-actie-cmd:disabled { opacity: .35; cursor: default; }
    .mob-cmd-sub { display: block; font-size: .61rem; font-weight: 400; opacity: .6; margin-top: 1px; }

    /* ── Even instellen / link-dialog ── */
    .mob-link-dialog { padding: 18px 16px; }
    .mob-link-title { font-weight: 700; font-size: .88rem; color: var(--ink); margin-bottom: 6px; }
    .mob-link-sub { font-size: .8rem; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.5; }
    .mob-link-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .mob-link-btn {
      padding: 7px 16px; border-radius: 7px;
      font-family: inherit; font-size: .82rem; font-weight: 600;
      cursor: pointer; transition: background .12s, opacity .12s;
    }
    .mob-link-btn-ja  { background: var(--nav-bg); color: #fff; border: none; }
    .mob-link-btn-ja:hover { opacity: .88; }
    .mob-link-btn-nee { background: none; border: 1px solid var(--line); color: var(--ink-mid); }
    .mob-link-btn-nee:hover { background: var(--bg); }

    /* ── System message ── */
    .mob-sys {
      align-self: center;
      font-size: .72rem;
      color: var(--muted);
      padding: 4px 10px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>

<div class="mob-layout" id="mobLayout">
  <!-- Header — zelfde opmaak als desktop assist-hdr -->
  <header class="mob-header">
    <div class="mob-hdr-icon">C</div>
    <div class="mob-hdr-brand">
      <div class="mob-hdr-title">Clausula Assistent</div>
      <div class="mob-hdr-sub">Juridische vragen &amp; clausuleadviezen</div>
    </div>
    <div class="mob-hdr-actions">
      <button class="mob-hdr-btn" id="mobNieuwBtn" title="Nieuw gesprek" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="mob-hdr-btn" id="mobHistBtn" title="Eerdere gesprekken" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="mob-hdr-btn" id="mobDossierBtn" title="Koppel dossier" style="display:none" onclick="window.toonDossiers && window.toonDossiers()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
    <a href="/" class="mob-back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Terug
    </a>
  </header>

  <!-- Sessie-overlay -->
  <div id="mobSessiesOverlay" style="display:none;flex-direction:column;flex:1;overflow-y:auto;padding:12px 16px;gap:8px"></div>

  <!-- Dossier-overlay -->
  <div id="mobDossierOverlay" style="display:none;flex-direction:column;flex:1;overflow-y:auto;padding:12px 16px;gap:8px"></div>

  <!-- Disclaimer -->
  <div class="mob-disclaimer">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>Antwoorden zijn <strong>aanbevelingen</strong>. Eindverantwoordelijkheid voor documenten en beslissingen ligt bij de mediator of advocaat.</span>
  </div>

  <!-- Dossier-indicator balk -->
  <div class="mob-dossier-balk" id="mobDossierBalk">
    <span class="mob-dossier-balk-ico">🗂</span>
    <span class="mob-dossier-balk-label" id="mobDossierNaam"></span>
    <button class="mob-dossier-balk-x" id="mobDossierOntkoppel" title="Dossier ontkoppelen">✕</button>
  </div>

  <!-- Auth overlay (shown when not logged in) -->
  <div id="mobAuthOverlay" style="display:none">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#D0CAC0" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <p>U bent niet ingelogd.<br>Ga terug naar de hoofdapplicatie om in te loggen.</p>
    <a href="/" style="padding:8px 18px;background:var(--coral);color:#fff;border-radius:8px;text-decoration:none;font-size:.85rem;font-weight:600;">Naar inlogpagina</a>
  </div>

  <!-- Messages -->
  <div class="mob-msgs" id="mobMsgs" style="display:none"></div>

  <!-- Input -->
  <div class="mob-input-area" id="mobInputArea" style="display:none">
    <div class="mob-invoer-rij">
    <textarea class="mob-input" id="mobInput" rows="1"
      placeholder="Stel een juridische vraag…"></textarea>
    <button class="mob-send" id="mobSend" title="Stuur">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
    </div>
  </div>
</div>

<script>
(async function() {
  /* ── Auth ────────────────────────────────────────── */
  const { createClient } = window.supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let token = '';
  // Token bijhouden via onAuthStateChange zodat automatische Supabase-refresh (elk uur)
  // de variabele bijwerkt — anders verlopen calls na 1 uur met "Niet geautoriseerd".
  db.auth.onAuthStateChange((_, session) => {
    if (session) token = session.access_token;
    else document.getElementById('mobAuthOverlay').style.display = 'flex';
  });
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) throw new Error('geen sessie');
    token = session.access_token;
  } catch (_) {
    document.getElementById('mobAuthOverlay').style.display = 'flex';
    return;
  }

  /* ── UI elements ─────────────────────────────────── */
  document.getElementById('mobMsgs').style.display      = 'flex';
  document.getElementById('mobInputArea').style.display  = 'flex';
  document.getElementById('mobNieuwBtn').style.display   = 'flex';
  document.getElementById('mobDossierBtn').style.display = 'flex';

  const msgsEl  = document.getElementById('mobMsgs');
  const inputEl = document.getElementById('mobInput');
  const sendEl  = document.getElementById('mobSend');

  /* ── State ───────────────────────────────────────── */
  const conversatie = [];
  let bezig = false;
  let thinkingEl = null;
  const MOB_PFX = 'assist_mob_';
  let sessieId = null;
  let modus = 'advies';

  /* ── Dossier state ── */
  let dossierId      = null;
  let dossierLabel   = '';
  let dossierContext = null;
  let huidigeNaarAnon = null; // AVG: naam-pseudonimisering (Map, gebouwd door bouwAnonMap)

  /* ── Sessie-opslag ───────────────────────────────── */
  function slaOpInStorage() {
    sessieId = AssistCore.slaOpInStorage(sessieId, {
      conversatie, dossierId, dossierNaam: dossierLabel, dossierContext,
    }, MOB_PFX);
    AssistCore.opruimenAlgemeen(MOB_PFX, 10);
  }

  function laadSessies() {
    return AssistCore.laadSessies(MOB_PFX);
  }

  function toonSessies() {
    const overlay = document.getElementById('mobSessiesOverlay');
    const sessies = laadSessies();
    const chatEl  = document.getElementById('mobMsgs');
    const inputArea = document.getElementById('mobInputArea');
    const disc    = document.querySelector('.mob-disclaimer');

    chatEl.style.display    = 'none';
    inputArea.style.display = 'none';
    if (disc) disc.style.display = 'none';
    overlay.style.display   = 'flex';

    if (!sessies.length) {
      overlay.innerHTML = `
        <div style="color:var(--muted);font-size:.85rem;padding:20px 0;text-align:center">Geen opgeslagen gesprekken.</div>
        <button onclick="verbergSessies()" style="align-self:center;padding:8px 18px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.85rem">← Terug</button>`;
      return;
    }

    overlay.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-weight:600;font-size:.9rem">Eerdere gesprekken</span>
        <button onclick="verbergSessies()" style="padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.8rem">← Terug</button>
      </div>` +
      sessies.map(s => {
        const datum = new Date(s.timestamp).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
        return `<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer" onclick="herlaadSessie('${s.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(s.titel)}</div>
            <div style="font-size:.75rem;color:var(--muted);margin-top:2px">${datum}</div>
          </div>
          <button onclick="verwijderSessie('${s.id}',event)" title="Verwijderen" style="flex-shrink:0;padding:4px 7px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem">✕</button>
        </div>`;
      }).join('');
  }

  function verbergSessies() {
    const overlay   = document.getElementById('mobSessiesOverlay');
    const chatEl    = document.getElementById('mobMsgs');
    const inputArea = document.getElementById('mobInputArea');
    const disc      = document.querySelector('.mob-disclaimer');
    overlay.style.display   = 'none';
    chatEl.style.display    = 'flex';
    inputArea.style.display = 'flex';
    if (disc) disc.style.display = '';
  }

  function herlaadSessie(id) {
    const raw = localStorage.getItem(id);
    if (!raw) return;
    try {
      const s = JSON.parse(raw);
      conversatie.length = 0;
      conversatie.push(...(s.conversatie || []));
      sessieId = s.id;
      verbergSessies();
      msgsEl.innerHTML = '';
      for (const b of conversatie) {
        if (b.role === 'user')      voegGebruikerBericht(b.content);
        else if (b.role === 'assistant') voegAssistentBericht(b.content, b.bronnen || []);
      }
      scrollNaar();
    } catch(e) {}
  }

  function verwijderSessie(id, ev) {
    ev.stopPropagation();
    localStorage.removeItem(id);
    if (sessieId === id) { sessieId = null; conversatie.length = 0; }
    toonSessies();
  }

  // Globaal bereikbaar voor inline onclick in sessie-lijst
  window.verbergSessies  = verbergSessies;
  window.herlaadSessie   = herlaadSessie;
  window.verwijderSessie = verwijderSessie;

  /* ── Dossier koppeling ───────────────────────────── */

  function toonDossierBalk() {
    const balk = document.getElementById('mobDossierBalk');
    document.getElementById('mobDossierNaam').innerHTML = dossierLabel
      ? `Dossier: <strong>${escH(dossierLabel)}</strong>` : '';
    balk.style.display = dossierLabel ? 'flex' : 'none';
  }

  function ontkoppelDossier() {
    dossierId    = null;
    dossierLabel = '';
    dossierContext = null;
    document.getElementById('mobDossierBalk').style.display = 'none';
    voegSysteemMelding('Dossier ontkoppeld.');
  }

  async function toonDossiers() {
    const overlay   = document.getElementById('mobDossierOverlay');
    const chatEl    = document.getElementById('mobMsgs');
    const inputArea = document.getElementById('mobInputArea');
    const disc      = document.querySelector('.mob-disclaimer');
    const dBalk     = document.getElementById('mobDossierBalk');

    chatEl.style.display    = 'none';
    inputArea.style.display = 'none';
    if (disc) disc.style.display = 'none';
    dBalk.style.display     = 'none';
    overlay.style.display   = 'flex';
    overlay.innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:16px 0;text-align:center">Bezig met laden…</div>';

    try {
      const { data, error } = await db
        .from('dossiers')
        .select('id, naam, updated_at')
        .order('naam');

      if (error) throw error;

      if (!data || !data.length) {
        overlay.innerHTML = `
          <div style="color:var(--muted);font-size:.85rem;padding:20px 0;text-align:center">Geen opgeslagen dossiers gevonden.</div>
          <button onclick="verbergDossiers()" style="align-self:center;padding:8px 18px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.85rem">← Terug</button>`;
        return;
      }

      overlay.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-weight:600;font-size:.9rem">Koppel een dossier</span>
          <button onclick="verbergDossiers()" style="padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.8rem">← Terug</button>
        </div>
        <div style="font-size:.72rem;color:var(--muted);margin-bottom:8px">Dossiercontext wordt meegestuurd bij elk bericht.</div>` +
        data.map(d => {
          const datum = d.updated_at
            ? new Date(d.updated_at).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })
            : '';
          const actief = d.id === dossierId ? ' style="border-color:var(--coral)"' : '';
          return `<div${actief} style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer" onclick="selecteerDossier('${escH(d.id)}','${escH(d.naam || 'Dossier')}')">
            <div style="flex:1;min-width:0">
              <div style="font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(d.naam || 'Naamloos')}</div>
              ${datum ? `<div style="font-size:.75rem;color:var(--muted);margin-top:2px">${datum}</div>` : ''}
            </div>
            <span style="font-size:.7rem;color:var(--muted)">→</span>
          </div>`;
        }).join('');
    } catch (err) {
      overlay.innerHTML = `
        <div style="color:var(--muted);font-size:.85rem;padding:16px 0;text-align:center">Fout bij laden: ${escH(err.message)}</div>
        <button onclick="verbergDossiers()" style="align-self:center;padding:8px 18px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.85rem">← Terug</button>`;
    }
  }

  function verbergDossiers() {
    const overlay   = document.getElementById('mobDossierOverlay');
    const chatEl    = document.getElementById('mobMsgs');
    const inputArea = document.getElementById('mobInputArea');
    const disc      = document.querySelector('.mob-disclaimer');
    overlay.style.display   = 'none';
    chatEl.style.display    = 'flex';
    inputArea.style.display = 'flex';
    if (disc) disc.style.display = '';
    toonDossierBalk();
  }

  async function selecteerDossier(id, naam, autoStart = false) {
    verbergDossiers();
    try {
      // Probeer eerst via dossier_id; bij oudere records (dossier_id = null) is id de PK
      let data = await AssistCore.laadScreeningData(db, id);
      if (!data) {
        const { data: row } = await db
          .from('screeningen')
          .select('classificatie, rapport, bestandsnaam, namen_map')
          .eq('id', id)
          .maybeSingle();
        data = row || null;
      }
      if (!data) throw new Error('Dossier niet gevonden');

      // Pseudoniemen terugvertalen — zelfde stap als laadScreening() op de desktop.
      // Moet vóór bouwAnonMap gebeuren: die map wordt uit de HERSTELDE classificatie
      // gebouwd, zodat de context die naar Claude gaat weer gepseudonimiseerd is.
      // Zonder deze stap toont de assistent overal "Thomas Bergman".
      await _ontsleutelNamen(data);

      dossierId    = id;
      dossierLabel = _kortDossierLabel(data.classificatie, data.bestandsnaam || naam);
      // Bouw pseudonimiseringsmap (AVG) voor deze dossiercontext
      huidigeNaarAnon = window.bouwAnonMap
        ? window.bouwAnonMap(data.classificatie, [data.bestandsnaam].filter(Boolean)).naarAnon
        : null;
      const _anonPipeline = (huidigeNaarAnon && huidigeNaarAnon.size)
        ? (s) => window.anonimiseerTekst(s, huidigeNaarAnon)
        : null;
      dossierContext = AssistCore.bouwDossierContext(
        data.classificatie,
        data.rapport,
        _anonPipeline ? { anonPipeline: _anonPipeline } : {},
      );
      toonDossierBalk();
      if (autoStart) {
        _assistStartChat(`Dossier **${dossierLabel}** is gekoppeld. Welke vraag kan ik voor u beantwoorden?`);
      } else {
        _updateLinkDialog();
      }
    } catch (err) {
      voegSysteemMelding(`Kon dossier niet laden: ${err.message}`);
    }
  }

  window.toonDossiers     = toonDossiers;
  window.verbergDossiers  = verbergDossiers;
  window.selecteerDossier = selecteerDossier;

  /* ── Helpers ─────────────────────────────────────── */
  // Gedeelde implementaties via assistent-core.js (superset van de vorige locale versies)
  const escH          = AssistCore.escH;
  const renderMarkdown = AssistCore.renderMarkdown;

  // ── Pseudoniemen terugvertalen ──────────────────────────────────────────────
  // Claude krijgt en geeft nep-namen; de echte namen zitten versleuteld in
  // screeningen.namen_map. Zelfde opzet als _assistHerstelNamen op de desktop.
  let mobNaarEcht = new Map();   // nep-naam → echte naam

  function _mobHerstelNamen(tekst) {
    if (!mobNaarEcht.size || typeof tekst !== 'string' || !tekst) return tekst;
    let t = tekst;
    // Langste sleutels eerst: anders vervangt "Thomas" de voornaam binnen
    // "Thomas Bergman" en blijft de achternaam als pseudoniem staan.
    for (const [nep, echt] of [...mobNaarEcht.entries()].sort((a, b) => b[0].length - a[0].length)) {
      if (!nep || nep.length < 2) continue;
      const esc = nep.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      t = t.replace(new RegExp(`\\b${esc}\\b`, 'g'), echt);
    }
    return t;
  }

  function _mobHerstelObj(obj) {
    if (typeof obj === 'string') return _mobHerstelNamen(obj);
    if (Array.isArray(obj)) return obj.map(_mobHerstelObj);
    if (obj && typeof obj === 'object') {
      return Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, _mobHerstelObj(v)]));
    }
    return obj;
  }

  async function _ontsleutelNamen(data) {
    mobNaarEcht = new Map();
    if (!data?.namen_map) return;   // oudere screening zonder map: blijft pseudoniem
    try {
      const { data: { session } } = await db.auth.getSession();
      const resp = await fetch('/api/naam-decrypt', {
        method:  'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${session?.access_token || ''}`,
        },
        body: JSON.stringify({ blob: data.namen_map }),
      });
      if (!resp.ok) { console.warn('[assistent] naam-decrypt HTTP', resp.status); return; }
      const { entries } = await resp.json();
      mobNaarEcht = new Map(entries);
      data.rapport       = _mobHerstelObj(data.rapport);
      data.classificatie = _mobHerstelObj(data.classificatie);
    } catch (e) {
      // Niet fataal: zonder ontsleuteling toont de assistent pseudoniemen.
      console.warn('[assistent] naam-decrypt mislukt (niet-fataal):', e.message);
    }
  }

  function _achternaam(volNaam) {
    const TUSSENV = ['van', 'de', 'der', 'den', 'ten', 'ter', 'te', 'op'];
    const delen = (volNaam || '').trim().split(/\s+/);
    for (let i = 1; i < delen.length; i++) {
      if (TUSSENV.includes(delen[i].toLowerCase())) return delen.slice(i).join(' ');
    }
    return delen[delen.length - 1] || '';
  }

  // De classificatie uit Supabase is gepseudonimiseerd zodra er een namen_map is
  // (bouwClassificatiePseudo maakt er [PERSOON_A] van), en mobiel ontsleutelt die
  // map niet. Zonder deze check toont de dossierbalk "[PERSOON_A] – [PERSOON_B]".
  const _isPseudoNaam = (s) => /^\[[A-Z_]+\d*\]$/.test((s || '').trim());

  function _kortDossierLabel(classificatie, bestandsnaam) {
    const ruwA = classificatie?.partij_a_naam;
    const ruwB = classificatie?.partij_b_naam;
    const a = _isPseudoNaam(ruwA) ? '' : _achternaam(ruwA);
    const b = _isPseudoNaam(ruwB) ? '' : _achternaam(ruwB);
    if (a && b) return `${a} – ${b}`;
    if (a) return a;
    return (bestandsnaam || '').replace(/\.[^.]+$/, '').slice(0, 35);
  }

  function scrollNaar() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  /* ── Berichten toevoegen ─────────────────────────── */
  function voegGebruikerBericht(tekst) {
    const wrap = document.createElement('div');
    wrap.className = 'mob-bubble-wrap user';
    wrap.innerHTML = `<div class="mob-bubble user">${escH(tekst)}</div>`;
    msgsEl.appendChild(wrap);
    scrollNaar();
  }

  function voegDenkenToe() {
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'mob-thinking';
    thinkingEl.innerHTML = '<div class="mob-dot"></div><div class="mob-dot"></div><div class="mob-dot"></div>';
    msgsEl.appendChild(thinkingEl);
    scrollNaar();
  }

  function verwijderDenken() {
    thinkingEl?.remove();
    thinkingEl = null;
  }

  // De server meldt tijdens de zoekloop wat hij opzoekt; die loop duurt zo'n twintig
  // seconden en dat is te lang om alleen drie stipjes te tonen.
  function zetDenkLabel(tekst) {
    if (!thinkingEl) return;
    let span = thinkingEl.querySelector('.mob-denk-label');
    if (!span) {
      span = document.createElement('span');
      span.className = 'mob-denk-label';
      span.style.cssText = 'margin-left:8px;font-size:.78rem;color:var(--ink-soft)';
      thinkingEl.appendChild(span);
    }
    span.textContent = tekst;
  }

  // Moet gelijk lopen met STREAM_ONDERDELEN in api/ai-assistent.js — die bepaalt
  // welke onderdelen de server onderweg meldt.
  const STREAM_ONDERDELEN = [
    { veld: 'bronnen',       label: 'Bronnen' },
    { veld: 'aannames',      label: 'Aannames' },
    { veld: 'signalen',      label: 'Signalen' },
    { veld: 'vervolgacties', label: 'Vervolgacties' },
  ];

  // Het streamende antwoord bouwt zichzelf op met voegAssistentBericht — dezelfde
  // functie die het eindbericht tekent. Daarom is de opmaak onderweg per definitie
  // gelijk aan die aan het eind. Een aparte voorvertoning was een tweede renderer,
  // en die zag er net anders uit.
  function maakStreamBericht() {
    let wrap = null;
    let ruw  = '';
    // Alle velden die de server onderweg kan sturen. Bij een optie-antwoord staat de
    // inhoud in `opties` en bevat `antwoord` alleen een korte inleiding.
    const data = {
      bronnen: [], aannames: [], signalen: [], vervolgacties: [], opties: [], onbekenden: [],
    };
    const binnen = new Set();

    const herteken = () => {
      wrap = voegAssistentBericht(ruw, data.bronnen, [], {
        aannames:      data.aannames,
        signalen:      data.signalen,
        onbekenden:    data.onbekenden,
        vervolgacties: data.vervolgacties,
        opties:        data.opties,
      }, {
        doelWrap: wrap,
        bezigMet: STREAM_ONDERDELEN.map(o => ({ label: o.label, klaar: binnen.has(o.veld) })),
      });
    };

    return {
      groei(stuk) {
        if (!ruw) verwijderDenken();
        ruw += stuk;
        herteken();
      },
      sectie(veld, waarde) {
        if (!(veld in data)) return;
        data[veld] = Array.isArray(waarde) ? waarde : [];
        binnen.add(veld);
        if (!ruw) verwijderDenken();   // opties komen soms vóór de inleidende tekst
        herteken();
      },
      weg() { wrap?.remove(); },
    };
  }

  function selecteerKeuze(btn, vraagLabel, keuze) {
    const blok = btn.closest('.mob-vraag-blok');
    if (blok) {
      blok.querySelectorAll('.mob-keuze-btn').forEach(b => b.classList.remove('geselecteerd'));
      btn.classList.add('geselecteerd');
    }

    // "Nee / volstaat" → stil afsluiten, toon actie-knoppen
    if (keuze.toLowerCase().includes('volstaat')) {
      blok?.classList.add('inactief');
      conversatie.push({ role: 'user', content: keuze });
      slaOpInStorage();
      msgsEl.querySelectorAll('.mob-na-advies-knoppen').forEach(el => el.remove());
      const actieBalk = document.createElement('div');
      actieBalk.className = 'mob-na-advies-knoppen';
      const mkBtn = (label, fn) => {
        const b = document.createElement('button');
        b.className = 'mob-actie-btn';
        b.textContent = label;
        b.onclick = fn;
        return b;
      };
      actieBalk.appendChild(mkBtn('💡 Opties uitwerken', () => { actieBalk.remove(); stuurActie('opties'); }));
      actieBalk.appendChild(mkBtn('📋 Samenvatting', () => { actieBalk.remove(); stuurActie('samenvatting'); }));
      msgsEl.appendChild(actieBalk);
      msgsEl.scrollTop = msgsEl.scrollHeight;
      return;
    }

    // Sla keuze op in blok
    if (blok) { blok.dataset.vraag = vraagLabel; blok.dataset.keuze = keuze; }

    const wrap = btn.closest('.mob-bubble-wrap');
    const actieveBlokken = wrap
      ? [...wrap.querySelectorAll('.mob-vraag-blok:not(.inactief)')]
      : [];
    const beantwoord = actieveBlokken.filter(b => b.dataset.keuze);

    if (beantwoord.length >= actieveBlokken.length && actieveBlokken.length > 0) {
      const tekst = beantwoord.map(b => `${b.dataset.vraag}: ${b.dataset.keuze}`).join('\n');
      setTimeout(() => stuurBericht(tekst), 150);
    }
  }

  // Labels via core (superset — mobiel toont alleen de acties die ook knoppen hebben)
  const VERVOLGACTIE_LABELS = AssistCore.VERVOLGACTIE_LABELS;
  const ONBEKENDEN_LABELS   = AssistCore.ONBEKENDEN_LABELS;

  const _TOGGLE_FN = `var b=this.querySelector('.meta-arrow'),d=this.nextElementSibling;if(d){d.classList.toggle('open');if(b)b.style.transform=d.classList.contains('open')?'rotate(90deg)':''}`;

  function _mkDetails(cls, summaryHtml, lijstItems) {
    const wrap = document.createElement('div');
    const items = lijstItems.map(t => `<li>${t}</li>`).join('');
    wrap.innerHTML = `<button class="mob-meta-hdr${cls ? ' ' + cls : ''}" onclick="${_TOGGLE_FN}">
      <em class="meta-arrow">▸</em>${summaryHtml}
    </button>
    <div class="mob-meta-body"><ul>${items}</ul></div>`;
    return wrap;
  }

  // opts.doelWrap — teken opnieuw in een bestaand bericht in plaats van er een aan te
  // maken. Zo bouwt het streamende antwoord zichzelf op met dezelfde functie, en is de
  // opmaak onderweg per definitie gelijk aan die aan het eind.
  // opts.bezigMet — onderdelen die nog onderweg zijn, als voortgangsregel onderaan.
  function voegAssistentBericht(tekst, bronnen, vragen = [], data = {}, opts = {}) {
    if (!opts.doelWrap) {
      msgsEl.querySelectorAll('.mob-vraag-blok:not(.inactief)').forEach(b => b.classList.add('inactief'));
    }
    const wrap = opts.doelWrap || document.createElement('div');
    wrap.innerHTML = '';
    wrap.className = 'mob-bubble-wrap assist';

    // ── Bubble: hoofdtekst + secties binnen de kaart ──────────────
    const bubble = document.createElement('div');
    bubble.className = 'mob-bubble assist';
    // Pseudoniemen → echte namen. Ook op de metablokken hieronder, anders staat
    // de ene helft van hetzelfde antwoord op nep-namen (zie desktop-bug in opties).
    bubble.innerHTML = renderMarkdown(_mobHerstelNamen(tekst));

    const aannames   = data.aannames   || [];
    const signalen   = data.signalen   || [];
    const onbekenden = data.onbekenden || [];

    if (aannames.length || signalen.length || onbekenden.length) {
      bubble.classList.add('heeft-secties');
    }

    // Signalen
    if (signalen.length > 0) {
      const hoog   = signalen.filter(s => s.ernst === 'hoog').length;
      const midden = signalen.filter(s => s.ernst === 'midden').length;
      const bH = hoog   ? `<span class="mob-sig-hoog">${hoog} hoog</span>` : '';
      const bM = midden ? `<span class="mob-sig-midden">${midden} midden</span>` : '';
      const items = signalen.map(s =>
        `<span class="mob-sig-${s.ernst}">[${s.ernst}]</span> ${escH(_mobHerstelNamen(s.tekst))}`);
      const sigCls = hoog ? 'sig-hoog' : midden ? 'sig-midden' : '';
      bubble.appendChild(_mkDetails(sigCls,
        `⚠ Signalen — ${[bH, bM].filter(Boolean).join(' · ')}`, items));
    }

    // Aannames
    if (aannames.length > 0) {
      bubble.appendChild(_mkDetails('', `Aannames (${aannames.length})`,
        aannames.map(a => escH(_mobHerstelNamen(a)))));
    }

    // Onbekenden ("? huwelijkse voorwaarden")
    if (onbekenden.length > 0) {
      const labels = onbekenden.map(o => ONBEKENDEN_LABELS[o.veld] || o.veld);
      const items  = onbekenden.map(o =>
        `<strong>${escH(ONBEKENDEN_LABELS[o.veld] || o.veld)}</strong> — ${escH(_mobHerstelNamen(o.effect))}`);
      bubble.appendChild(_mkDetails('', `? ${labels.join(', ')}`, items));
    }

    wrap.appendChild(bubble);

    // ── Opties-kaartjes (buiten kaart, zoals desktop) ──────────────
    const opties = data.opties || [];
    if (opties.length > 0) {
      const optiesWrap = document.createElement('div');
      optiesWrap.className = 'mob-opties-wrap';
      opties.forEach(o => {
        const kaart = document.createElement('div');
        kaart.className = 'mob-optie-kaart';
        kaart.innerHTML = `<div class="mob-optie-titel">${escH(o.titel || '')}</div>` +
          (o.kern        ? `<div class="mob-optie-kern">${escH(o.kern)}</div>` : '') +
          (o.afwegingen  ? `<div class="mob-optie-afwegingen">${escH(o.afwegingen)}</div>` : '');
        optiesWrap.appendChild(kaart);
      });
      wrap.appendChild(optiesWrap);
    }

    // ── Vervolgacties ──────────────────────────────────────────────
    const vervolgacties = (data.vervolgacties || []).filter(a => {
      if (!VERVOLGACTIE_LABELS[a] || _MOB_VERBORGEN_ACTIES.has(a)) return false;
      if (a === 'toepassen_op_casus' && !dossierId) return false;
      return true;
    });
    if (vervolgacties.length > 0) {
      const balk = document.createElement('div');
      balk.className = 'mob-vervolgacties';
      vervolgacties.forEach(actie => {
        const btn = document.createElement('button');
        btn.className = 'mob-vervolgactie-btn';
        btn.textContent = VERVOLGACTIE_LABELS[actie];
        btn.onclick = () => { balk.remove(); stuurActie(actie); };
        balk.appendChild(btn);
      });
      wrap.appendChild(balk);
    }

    // ── Kopieer ────────────────────────────────────────────────────
    const copyBtn = document.createElement('button');
    copyBtn.className = 'mob-copy-btn';
    copyBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Kopieer`;
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(tekst).then(() => {
        copyBtn.textContent = '✓ Gekopieerd';
        copyBtn.classList.add('gekopieerd');
        setTimeout(() => {
          copyBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Kopieer`;
          copyBtn.classList.remove('gekopieerd');
        }, 2000);
      }).catch(() => {});
    };
    if (!opts.skipKopieer) wrap.appendChild(copyBtn);

    // ── Bronnen ────────────────────────────────────────────────────
    if (bronnen && bronnen.length > 0) {
      const bronnenSectie = document.createElement('div');
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'mob-bronnen-toggle';
      const BTOGGLE = `var c=this.nextElementSibling;c.classList.toggle('open');this.querySelector('.meta-arrow').textContent=c.classList.contains('open')?'▾':'▸'`;
      toggleBtn.setAttribute('onclick', BTOGGLE);
      toggleBtn.innerHTML = `<em class="meta-arrow">▸</em> Bronnen (${bronnen.length})`;
      const chipsEl = document.createElement('div');
      chipsEl.className = 'mob-bronnen-chips';
      bronnen.forEach(b => {
        const chip = document.createElement('span');
        chip.className = 'mob-bron';
        if (b.url) {
          chip.innerHTML = `<a href="${escH(b.url)}" target="_blank" rel="noopener">${escH(b.titel || b.citation || b.url)}</a>`;
        } else {
          chip.textContent = b.citation || b.titel || '';
        }
        chipsEl.appendChild(chip);
      });
      bronnenSectie.appendChild(toggleBtn);
      bronnenSectie.appendChild(chipsEl);
      wrap.appendChild(bronnenSectie);
    }

    // ── Verduidelijkingsvragen ─────────────────────────────────────
    if (vragen && vragen.length > 0) {
      vragen.forEach(v => {
        const vraagEl = document.createElement('div');
        vraagEl.className = 'mob-vraag-blok';
        const labelEl = document.createElement('div');
        labelEl.className = 'mob-vraag-label';
        labelEl.textContent = v.label;
        vraagEl.appendChild(labelEl);
        const keuzesEl = document.createElement('div');
        keuzesEl.className = 'mob-keuzes';
        v.keuzes.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'mob-keuze-btn';
          btn.textContent = k;
          btn.onclick = () => selecteerKeuze(btn, v.label, k);
          keuzesEl.appendChild(btn);
        });
        vraagEl.appendChild(keuzesEl);
        wrap.appendChild(vraagEl);
      });
    }

    if (opts.bezigMet?.length) {
      const rest = document.createElement('div');
      rest.className = 'mob-stream-rest';
      rest.innerHTML = '<span class="mob-stream-lbl">Nog bezig met</span>'
        + opts.bezigMet.map(o =>
            `<span class="mob-stream-chip${o.klaar ? ' klaar' : ''}">${escH(o.label)}</span>`).join('');
      bubble.appendChild(rest);
    }

    if (!opts.doelWrap) msgsEl.appendChild(wrap);
    scrollNaar();
    return wrap;
  }

  function voegSysteemMelding(tekst) {
    const el = document.createElement('div');
    el.className = 'mob-sys';
    el.textContent = tekst;
    msgsEl.appendChild(el);
    scrollNaar();
  }

  /* ── Versturen ───────────────────────────────────── */
  async function stuurBericht(forceTekst) {
    if (bezig) return;
    const tekst = (forceTekst || inputEl.value).trim();
    if (!tekst) return;

    if (!forceTekst) {
      inputEl.value = '';
      inputEl.style.height = 'auto';
      voegGebruikerBericht(tekst);
    }
    voegDenkenToe();
    bezig = true;
    sendEl.disabled = true;

    try {
      // AVG: anonimiseer vraag vóór verzending naar Anthropic API
      let vraagAnon = tekst;
      if (huidigeNaarAnon && huidigeNaarAnon.size && window.anonimiseerTekst) {
        vraagAnon = window.anonimiseerTekst(tekst, huidigeNaarAnon);
      }
      if (window.piiAnonimiseer) {
        vraagAnon = window.piiAnonimiseer(vraagAnon);
      }

      const resp = await fetch('/api/ai-assistent', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({
          vraag:          vraagAnon,
          conversatie:    conversatie,
          dossierContext: dossierContext || undefined,
          dossierId:      dossierId     || undefined,
          stijl:          'juridisch_volledig',
          stream:         true,
        }),
      });

      let data;
      if (resp.ok && resp.headers.get('content-type')?.includes('text/event-stream')) {
        const bericht = maakStreamBericht();
        try {
          data = await leesStroom(resp, {
            onFase:   zetDenkLabel,
            onDelta:  s => bericht.groei(s),
            onSectie: (veld, waarde) => bericht.sectie(veld, waarde),
          });
        } finally {
          bericht.weg();
        }
      } else {
        data = await leesAntwoord(resp);   // server viel terug op JSON
      }

      verwijderDenken();
      voegAssistentBericht(data.antwoord, data.bronnen || [], data.vragen || [], data);

      conversatie.push({ role: 'user',      content: vraagAnon });
      conversatie.push({ role: 'assistant', content: data.antwoord, bronnen: data.bronnen || [] });
      if (conversatie.length > 20) conversatie.splice(0, 2);
      slaOpInStorage();

    } catch (err) {
      verwijderDenken();
      voegAssistentBericht(`Er is een fout opgetreden: ${err.message}. Probeer het opnieuw.`, []);
    } finally {
      bezig = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  }

  /* ── Acties ──────────────────────────────────────── */
  // Vervolgacties die mobiel NIET als chip toont (te complex / niet relevant op mobiel)
  const _MOB_VERBORGEN_ACTIES = new Set(['clausule_opstellen', 'klanttekst', 'andere_stijl']);

  function _setActieCmdDisabled(_state) { /* actie-balk verwijderd */ }

  async function stuurActie(soort) {
    if (bezig) return;
    const prompts = {
      opties:              'Welke juridische opties zijn er voor partijen in deze situatie? Geef per optie de voor- en nadelen, zodat de mediator dit als gespreksgrondslag kan gebruiken.',
      opties_voor_klanten: 'Welke juridische opties zijn er voor partijen in deze situatie? Geef per optie de voor- en nadelen, zodat de mediator dit als gespreksgrondslag kan gebruiken.',
      samenvatting:        'Maak een beknopte samenvatting van ons gesprek voor de mediator: de kernvraag, de besproken situatie, de juridische analyse en eventuele vervolgstappen.',
      clausule_opstellen:  'Stel een passende clausule op voor de besproken situatie. Geef een minimale en een uitgebreide variant met juridische onderbouwing.',
      klanttekst:          'Schrijf een beknopte, begrijpelijke samenvatting van de juridische situatie voor de cliënten zelf. Gebruik heldere taal zonder juridisch jargon.',
      klantmail:           'Schrijf een professionele e-mail aan de cliënten met daarin de juridische samenvatting en de afgesproken actiepunten. Gebruik een formele maar toegankelijke toon.',
      andere_stijl:        'Herschrijf je vorige antwoord in een andere stijl: compacter, praktischer en directer gericht op de mediator.',
      toets_aan_dossier:   'Toets de besproken juridische punten specifiek aan de kenmerken van dit dossier. Geef aan welke aspecten bijzondere aandacht vereisen.',
      toepassen_op_casus:  'Vertaal de juridische analyse naar concrete actiepunten voor de mediator in deze specifieke casus.',
    };
    const prompt = prompts[soort];
    if (!prompt) return;

    const _labels = {
      opties: '💡 Opties weergeven', samenvatting: '📋 Samenvatting gesprek',
      clausule_opstellen: '📝 Clausule opstellen', klantmail: '✉️ Klantmail opstellen',
    };
    const userLabel = VERVOLGACTIE_LABELS[soort] || _labels[soort] || soort;
    voegGebruikerBericht(userLabel);
    conversatie.push({ role: 'user', content: prompt });
    voegDenkenToe();
    bezig = true;
    sendEl.disabled = true;
    _setActieCmdDisabled(true);
    try {
      const resp = await fetch('/api/ai-assistent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          vraag: prompt, conversatie: conversatie.slice(0, -1),
          dossierContext: dossierContext || undefined,
          dossierId:      dossierId     || undefined,
          stijl:          'juridisch_volledig',
          stream:         true,
        }),
      });

      let data;
      if (resp.ok && resp.headers.get('content-type')?.includes('text/event-stream')) {
        const bericht = maakStreamBericht();
        try {
          data = await leesStroom(resp, {
            onFase:   zetDenkLabel,
            onDelta:  s => bericht.groei(s),
            onSectie: (veld, waarde) => bericht.sectie(veld, waarde),
          });
        } finally {
          bericht.weg();
        }
      } else {
        data = await leesAntwoord(resp);   // server viel terug op JSON
      }
      verwijderDenken();
      voegAssistentBericht(data.antwoord, data.bronnen || [], data.vragen || [], data);
      conversatie.push({ role: 'assistant', content: data.antwoord, bronnen: data.bronnen || [] });
      if (conversatie.length > 20) conversatie.splice(0, 2);
      slaOpInStorage();
    } catch (err) {
      verwijderDenken();
      voegAssistentBericht(`Er is een fout opgetreden: ${err.message}. Probeer het opnieuw.`, []);
      conversatie.pop();
    } finally {
      bezig = false;
      sendEl.disabled = false;
      _setActieCmdDisabled(false);
      inputEl.focus();
    }
  }

  /* ── "Even instellen" dossier-bevestigingsdialoog ─ */
  function toonLinkDialog() {
    msgsEl.innerHTML = '';
    const dlg = document.createElement('div');
    dlg.className = 'mob-link-dialog';
    dlg.id = 'mobLinkDialog';
    msgsEl.appendChild(dlg);
    _updateLinkDialog();
  }

  function _updateLinkDialog() {
    const dlg = document.getElementById('mobLinkDialog');
    if (!dlg) return;
    if (dossierId && dossierLabel && dossierLabel !== '…') {
      dlg.innerHTML = `
        <div class="mob-link-title">Even instellen</div>
        <div class="mob-link-sub">Heeft deze vraag betrekking op het dossier <strong>${escH(dossierLabel)}</strong>?</div>
        <div class="mob-link-btns">
          <button class="mob-link-btn mob-link-btn-ja" onclick="_mobLinkJa()">Ja</button>
          <button class="mob-link-btn mob-link-btn-nee" onclick="_mobLinkNee()">Nee, algemene vraag</button>
        </div>`;
    } else {
      dlg.innerHTML = `
        <div class="mob-link-title">Even instellen</div>
        <div class="mob-link-sub">Wil je een analyse koppelen zodat de assistent de dossiergegevens kent?</div>
        <div class="mob-link-btns">
          <button class="mob-link-btn mob-link-btn-ja" onclick="_mobLinkKoppel()">🗂 Koppel analyse</button>
          <button class="mob-link-btn mob-link-btn-nee" onclick="_mobLinkNee()">Nee, algemene vraag</button>
        </div>`;
    }
  }

  function _mobLinkJa() {
    _assistStartChat(
      dossierId && dossierLabel
        ? `Dossier **${dossierLabel}** is gekoppeld. Stel gerust een juridische vraag.`
        : 'Stel gerust een juridische vraag.'
    );
  }

  function _mobLinkNee() {
    dossierId     = null;
    dossierLabel  = '';
    dossierContext = null;
    toonDossierBalk();
    _assistStartChat('Geen dossier gekoppeld. Stel gerust een juridische vraag.\n\nWil je later een dossier koppelen? Tik op het 🗂 pictogram bovenaan.');
  }

  function _mobLinkKoppel() {
    toonDossiers();
    // Na selectie van dossier updaten we de dialoog via _updateLinkDialog (zie selecteerDossier)
  }

  function _assistStartChat(welkomstTekst) {
    msgsEl.innerHTML = '';
    voegAssistentBericht(welkomstTekst, [], [], {}, { skipKopieer: true });
    inputEl.focus();
  }

  window._mobLinkJa      = _mobLinkJa;
  window._mobLinkNee     = _mobLinkNee;
  window._mobLinkKoppel  = _mobLinkKoppel;

  /* ── Event listeners ─────────────────────────────── */
  document.getElementById('mobDossierBtn').addEventListener('click', toonDossiers);
  document.getElementById('mobDossierOntkoppel').addEventListener('click', ontkoppelDossier);

  sendEl.addEventListener('click', () => stuurBericht());

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      stuurBericht();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  // Nieuw gesprek
  document.getElementById('mobNieuwBtn').addEventListener('click', () => {
    conversatie.length = 0;
    sessieId = null;
    toonLinkDialog();
  });

  // Eerdere gesprekken
  document.getElementById('mobHistBtn').style.display = 'flex';
  document.getElementById('mobHistBtn').addEventListener('click', toonSessies);

  /* ── Opstartscherm ───────────────────────────────── */
  const _urlParams = new URLSearchParams(window.location.search);
  const _autoSid   = _urlParams.get('s');
  if (_autoSid && db) {
    // Dossier rechtstreeks gekoppeld via URL — skip "Even instellen", start direct
    msgsEl.innerHTML = `<div class="mob-sys">Bezig met het dossier laden…</div>`;
    selecteerDossier(_autoSid, '…', true);
  } else {
    toonLinkDialog();
  }
})();
</script>
</body>
