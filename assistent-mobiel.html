<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Clausula Assistent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:    #FFFDF8;
      --bg:       #F6F3ED;
      --ink:      #1E1A15;
      --ink-mid:  #3A342B;
      --ink-soft: #6B6456;
      --muted:    #9C8F7E;
      --line:     #E2DED6;
      --coral:    #E56038;
      --coral-dk: #C24E29;
      --nav-bg:   #2A2218;
      --status-risico:   #C0392B;
      --status-aandacht: #D4860A;
      --status-ok:       #2E7D32;
      --bubble-user:     #2A2218;
      --bubble-assist:   #FFFDF8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    /* ── Layout ── */
    .mob-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 560px;
      /* Left-aligned: no auto margins */
    }

    /* ── Header ── */
    .mob-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 52px;
      background: var(--nav-bg);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .mob-header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .mob-brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--coral);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .85rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .mob-brand-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .78rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: .05em;
    }
    .mob-brand-sub {
      font-size: .68rem;
      color: rgba(255,255,255,.45);
      margin-left: 4px;
    }
    .mob-back-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.75);
      font-size: .72rem;
      font-weight: 500;
      text-decoration: none;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
    }
    .mob-back-btn:hover { background: rgba(255,255,255,.14); color: #fff; }

    .mob-new-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mob-new-btn:hover { background: rgba(255,255,255,.18); color: #fff; }

    /* ── Disclaimer strip ── */
    .mob-disclaimer {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px;
      background: #FEF9F0;
      border-bottom: 1px solid #F0E8CC;
      font-size: .72rem;
      color: #7A5F2A;
      line-height: 1.4;
    }
    .mob-disclaimer svg { flex-shrink: 0; margin-top: 1px; }

    /* ── Auth overlay ── */
    #mobAuthOverlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      padding: 32px 20px;
      text-align: center;
    }
    #mobAuthOverlay p { color: var(--ink-soft); font-size: .88rem; }

    /* ── Messages ── */
    .mob-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* Bubbles */
    .mob-bubble-wrap { display: flex; flex-direction: column; max-width: 88%; }
    .mob-bubble-wrap.user { align-self: flex-end; align-items: flex-end; }
    .mob-bubble-wrap.assist { align-self: flex-start; align-items: flex-start; }

    .mob-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: .875rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .mob-bubble.user {
      background: var(--bubble-user);
      color: rgba(255,255,255,.92);
      border-bottom-right-radius: 4px;
    }
    .mob-bubble.assist {
      background: var(--bubble-assist);
      color: var(--ink);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .mob-bubble h2, .mob-bubble h3 {
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--coral);
      margin: 10px 0 4px;
    }
    .mob-bubble h2:first-child, .mob-bubble h3:first-child { margin-top: 0; }
    .mob-bubble strong { font-weight: 600; }
    .mob-bubble p { margin-bottom: 6px; }
    .mob-bubble p:last-child { margin-bottom: 0; }
    .mob-bubble ul, .mob-bubble ol { padding-left: 18px; margin-bottom: 6px; }
    .mob-bubble li { margin-bottom: 3px; }
    .mob-bubble hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }

    /* Thinking indicator */
    .mob-thinking {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      background: var(--bubble-assist);
      border: 1px solid var(--line);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
    }
    .mob-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: mob-pulse 1.2s ease-in-out infinite;
    }
    .mob-dot:nth-child(2) { animation-delay: .2s; }
    .mob-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes mob-pulse {
      0%, 80%, 100% { opacity: .3; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Bronnen */
    .mob-bronnen {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .mob-bron {
      font-size: .68rem;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink-soft);
    }
    .mob-bron a { color: inherit; text-decoration: none; }
    .mob-bron a:hover { color: var(--coral); }

    /* Kopieer button */
    .mob-copy-btn {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: .7rem;
      cursor: pointer;
    }
    .mob-copy-btn:hover { border-color: var(--coral); color: var(--coral); }
    .mob-copy-btn.gekopieerd { color: var(--status-ok); border-color: var(--status-ok); }

    /* ── Input area ── */
    .mob-input-area {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 16px 14px;
      background: var(--paper);
      border-top: 1px solid var(--line);
    }
    .mob-input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      font-size: .875rem;
      color: var(--ink);
      resize: none;
      line-height: 1.45;
      max-height: 140px;
      overflow-y: auto;
    }
    .mob-input:focus {
      outline: none;
      border-color: var(--coral);
      background: var(--paper);
    }
    .mob-input::placeholder { color: var(--muted); }
    .mob-send {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--coral);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mob-send:hover { background: var(--coral-dk); }
    .mob-send:disabled { opacity: .45; cursor: not-allowed; }

    /* ── System message ── */
    .mob-sys {
      align-self: center;
      font-size: .72rem;
      color: var(--muted);
      padding: 4px 10px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>

<div class="mob-layout" id="mobLayout">
  <!-- Header -->
  <header class="mob-header">
    <div class="mob-header-brand">
      <div class="mob-brand-mark">C</div>
      <span class="mob-brand-name">Clausula</span>
      <span class="mob-brand-sub">Assistent</span>
    </div>
    <button class="mob-new-btn" id="mobNieuwBtn" title="Nieuw gesprek" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <a href="/" class="mob-back-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Terug
    </a>
  </header>

  <!-- Disclaimer -->
  <div class="mob-disclaimer">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>Antwoorden zijn <strong>aanbevelingen</strong>. Eindverantwoordelijkheid voor documenten en beslissingen ligt bij de mediator of advocaat.</span>
  </div>

  <!-- Auth overlay (shown when not logged in) -->
  <div id="mobAuthOverlay" style="display:none">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#D0CAC0" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <p>U bent niet ingelogd.<br>Ga terug naar de hoofdapplicatie om in te loggen.</p>
    <a href="/" style="padding:8px 18px;background:var(--coral);color:#fff;border-radius:8px;text-decoration:none;font-size:.85rem;font-weight:600;">Naar inlogpagina</a>
  </div>

  <!-- Messages -->
  <div class="mob-msgs" id="mobMsgs" style="display:none"></div>

  <!-- Input -->
  <div class="mob-input-area" id="mobInputArea" style="display:none">
    <textarea class="mob-input" id="mobInput" rows="1"
      placeholder="Stel een juridische vraag…"></textarea>
    <button class="mob-send" id="mobSend" title="Stuur">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
(async function() {
  /* ── Auth ────────────────────────────────────────── */
  const { createClient } = window.supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let token = '';
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) throw new Error('geen sessie');
    token = session.access_token;
  } catch (_) {
    document.getElementById('mobAuthOverlay').style.display = 'flex';
    return;
  }

  /* ── UI elements ─────────────────────────────────── */
  document.getElementById('mobMsgs').style.display     = 'flex';
  document.getElementById('mobInputArea').style.display = 'flex';
  document.getElementById('mobNieuwBtn').style.display  = 'flex';

  const msgsEl  = document.getElementById('mobMsgs');
  const inputEl = document.getElementById('mobInput');
  const sendEl  = document.getElementById('mobSend');

  /* ── State ───────────────────────────────────────── */
  const conversatie = [];
  let bezig = false;
  let thinkingEl = null;

  /* ── Helpers ─────────────────────────────────────── */
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(tekst) {
    // Heading ## of **Sectie**
    let html = escH(tekst);
    // ## Kop
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Horizontal rule ---
    html = html.replace(/^---+$/gm, '<hr>');
    // Bullets
    html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>(\n|$))+/g, '<ul>$&</ul>');
    // Numbered list
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Paragraphs (double newline)
    html = html.split(/\n{2,}/).map(b => {
      b = b.trim();
      if (!b || b.startsWith('<h') || b.startsWith('<ul') || b.startsWith('<ol') || b.startsWith('<hr') || b.startsWith('<li')) return b;
      return `<p>${b.replace(/\n/g,'<br>')}</p>`;
    }).join('');
    return html;
  }

  function scrollNaar() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  /* ── Berichten toevoegen ─────────────────────────── */
  function voegGebruikerBericht(tekst) {
    const wrap = document.createElement('div');
    wrap.className = 'mob-bubble-wrap user';
    wrap.innerHTML = `<div class="mob-bubble user">${escH(tekst)}</div>`;
    msgsEl.appendChild(wrap);
    scrollNaar();
  }

  function voegDenkenToe() {
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'mob-thinking';
    thinkingEl.innerHTML = '<div class="mob-dot"></div><div class="mob-dot"></div><div class="mob-dot"></div>';
    msgsEl.appendChild(thinkingEl);
    scrollNaar();
  }

  function verwijderDenken() {
    thinkingEl?.remove();
    thinkingEl = null;
  }

  function voegAssistentBericht(tekst, bronnen) {
    const wrap = document.createElement('div');
    wrap.className = 'mob-bubble-wrap assist';

    // Bubble
    const bubble = document.createElement('div');
    bubble.className = 'mob-bubble assist';
    bubble.innerHTML = renderMarkdown(tekst);
    wrap.appendChild(bubble);

    // Kopieer-knop
    const copyBtn = document.createElement('button');
    copyBtn.className = 'mob-copy-btn';
    copyBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Kopieer`;
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(tekst).then(() => {
        copyBtn.textContent = '✓ Gekopieerd';
        copyBtn.classList.add('gekopieerd');
        setTimeout(() => {
          copyBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Kopieer`;
          copyBtn.classList.remove('gekopieerd');
        }, 2000);
      }).catch(() => {});
    };
    wrap.appendChild(copyBtn);

    // Bronnen
    if (bronnen && bronnen.length > 0) {
      const bronnenEl = document.createElement('div');
      bronnenEl.className = 'mob-bronnen';
      bronnen.forEach(b => {
        const chip = document.createElement('span');
        chip.className = 'mob-bron';
        if (b.url) {
          chip.innerHTML = `<a href="${escH(b.url)}" target="_blank" rel="noopener">${escH(b.titel || b.citation || b.url)}</a>`;
        } else {
          chip.textContent = b.citation || b.titel || '';
        }
        bronnenEl.appendChild(chip);
      });
      wrap.appendChild(bronnenEl);
    }

    msgsEl.appendChild(wrap);
    scrollNaar();
  }

  function voegSysteemMelding(tekst) {
    const el = document.createElement('div');
    el.className = 'mob-sys';
    el.textContent = tekst;
    msgsEl.appendChild(el);
    scrollNaar();
  }

  /* ── Versturen ───────────────────────────────────── */
  async function stuurBericht() {
    if (bezig) return;
    const tekst = inputEl.value.trim();
    if (!tekst) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    voegGebruikerBericht(tekst);
    voegDenkenToe();
    bezig = true;
    sendEl.disabled = true;

    try {
      const resp = await fetch('/api/ai-assistent', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({
          vraag:       tekst,
          conversatie: conversatie,
        }),
      });

      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);

      verwijderDenken();
      voegAssistentBericht(data.antwoord, data.bronnen || []);

      conversatie.push({ role: 'user',      content: tekst });
      conversatie.push({ role: 'assistant', content: data.antwoord });
      if (conversatie.length > 20) conversatie.splice(0, 2);

    } catch (err) {
      verwijderDenken();
      voegAssistentBericht(`Er is een fout opgetreden: ${err.message}. Probeer het opnieuw.`, []);
    } finally {
      bezig = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  }

  /* ── Event listeners ─────────────────────────────── */
  sendEl.addEventListener('click', stuurBericht);

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      stuurBericht();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  // Nieuw gesprek
  document.getElementById('mobNieuwBtn').addEventListener('click', () => {
    conversatie.length = 0;
    msgsEl.innerHTML = '';
    voegSysteemMelding('Nieuw gesprek gestart.');
    inputEl.focus();
  });

  /* ── Welkomsbericht ──────────────────────────────── */
  voegAssistentBericht(
    'Goedendag! Ik ben de Clausula assistent. U kunt mij juridische vragen stellen over scheidingsmediation, familierecht, alimentatie, boedelscheiding, ouderschapsregelingen en aanverwante onderwerpen.\n\nWaar kan ik u mee helpen?',
    []
  );
  inputEl.focus();
})();
</script>
</body>
</html>
