<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantoor aanmelden — Documentscreening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F0; --paper:#FFFFFF; --line:#E8E1D6;
    --ink:#2B2825; --ink-soft:#6B6358;
    --coral:#E8714A; --coral-dark:#C75A38; --terra:#C75D4D;
    --sage:#5C8C6A;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);display:flex;align-items:center;
    justify-content:center;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);}

  .wrap{width:100%;max-width:460px;padding:32px 24px;}

  .logo{text-align:center;margin-bottom:36px;display:flex;flex-direction:column;align-items:center;}
  .logo-mark{width:52px;height:52px;background:#1B3050;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .logo h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:1.8rem;margin:0 0 4px;letter-spacing:-.01em;color:#1B3050;}
  .logo p{margin:0;color:var(--ink-soft);font-size:.95rem;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:32px;}
  .card h2{font-family:'Source Serif 4',serif;font-weight:600;font-size:1.25rem;margin:0 0 24px;}

  .sectie-label{font-size:.78rem;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-soft);margin:20px 0 12px;
    padding-bottom:6px;border-bottom:1px solid var(--line);}
  .sectie-label:first-of-type{margin-top:0;}

  label{display:block;font-size:.88rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:.97rem;color:var(--ink);background:var(--bg);
    outline:none;transition:border-color .15s;margin-bottom:16px;}
  input:focus{border-color:var(--coral);}

  button{width:100%;padding:13px;background:var(--coral);color:#fff;border:none;
    border-radius:10px;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:background .15s;margin-top:4px;}
  button:hover{background:var(--coral-dark);}
  button:disabled{background:#D8CFC2;cursor:not-allowed;}

  .fout{margin-top:16px;padding:12px 14px;border-radius:8px;
    background:#FCEFEC;border:1px solid #F0C8BE;color:var(--terra);font-size:.9rem;}
  .ok{margin-top:16px;padding:12px 14px;border-radius:8px;
    background:#EDF4EF;border:1px solid #B8D4C0;color:var(--sage);font-size:.9rem;}

  .login-link{text-align:center;margin-top:20px;font-size:.88rem;color:var(--ink-soft);}
  .login-link a{color:var(--coral);text-decoration:none;font-weight:600;}
  .login-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">
      <svg width="32" height="32" viewBox="0 0 100 100" fill="none">
        <path stroke="#D99A3D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
          d="M34 16 L20 24 L20 46 M66 16 L80 24 L80 46 M80 54 L80 76 L66 84 M34 84 L20 76 L20 54 M66 16 Q50 10 34 16 M34 84 Q50 90 66 84"/>
      </svg>
    </div>
    <h1>Clausula</h1>
    <p>Nieuw kantoor aanmelden</p>
  </div>
  <div class="card">
    <h2 id="paginaTitel">Account aanmaken</h2>

    <!-- Uitnodiging-banner (verborgen bij normaal registreren) -->
    <div id="uitnodigingBanner" style="display:none;padding:12px 14px;border-radius:8px;
      background:#EDF4EF;border:1px solid #B8D4C0;color:var(--sage);font-size:.9rem;margin-bottom:20px">
      Je bent uitgenodigd om je aan te sluiten bij <strong id="uitnodigingKantoor"></strong>.
    </div>

    <div id="kantoorVeld">
      <div class="sectie-label">Kantoor</div>
      <label for="kantoorNaam">Naam van het kantoor</label>
      <input type="text" id="kantoorNaam" placeholder="bijv. Dalstein Mediation" autocomplete="organization">
    </div>

    <div class="sectie-label">Jouw gegevens</div>
    <label for="naam">Jouw naam</label>
    <input type="text" id="naam" placeholder="Voor- en achternaam" autocomplete="name">

    <label for="email">E-mailadres</label>
    <input type="email" id="email" placeholder="naam@kantoor.nl" autocomplete="email">

    <label for="wachtwoord">Wachtwoord <span style="font-weight:400">(min. 8 tekens)</span></label>
    <input type="password" id="wachtwoord" placeholder="••••••••" autocomplete="new-password">

    <button id="registreerBtn">Kantoor aanmelden</button>
    <div class="fout" id="fout" style="display:none;"></div>
    <div class="ok"  id="ok"   style="display:none;"></div>
  </div>
  <p class="login-link">Al een account? <a href="login.html">Inloggen</a></p>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Uitnodigingstoken uit URL lezen ───────────────────
const _inviteToken = new URLSearchParams(window.location.search).get('invite');
let   _inviteOrgId = null;
let   _inviteRol   = 'gebruiker';

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    if (_inviteToken) {
      // Iemand opent een uitnodigingslink terwijl er al een andere gebruiker
      // ingelogd is — uitloggen zodat de uitgenodigde persoon kan registreren.
      await db.auth.signOut();
    } else {
      // Geen uitnodiging: al ingelogd én profiel compleet? Direct doorsturen.
      const { data: profiel } = await db.from('gebruikersprofiel')
        .select('organisatie_id').eq('id', session.user.id).single();
      if (profiel?.organisatie_id) { window.location.replace('index.html'); return; }
    }
  }

  // Uitnodiging valideren
  if (_inviteToken) {
    const { data, error } = await db.rpc('valideer_uitnodiging', { p_token: _inviteToken });
    const invite = Array.isArray(data) ? data[0] : data;
    if (!error && invite?.organisatie_id) {
      _inviteOrgId = invite.organisatie_id;
      _inviteRol   = invite.rol || 'gebruiker';
      // UI aanpassen voor uitgenodigde gebruiker
      document.getElementById('kantoorVeld').style.display      = 'none';
      document.getElementById('uitnodigingBanner').style.display = '';
      document.getElementById('uitnodigingKantoor').textContent  = invite.kantoor_naam;
      document.getElementById('paginaTitel').textContent         = 'Account aanmaken';
      document.querySelector('.logo p').textContent              = invite.kantoor_naam;
      document.getElementById('registreerBtn').textContent       = 'Account aanmaken';
    } else {
      // Ongeldige of verlopen uitnodiging
      document.getElementById('uitnodigingBanner').style.cssText =
        'display:block;background:#FCEFEC;border-color:#F0C8BE;color:var(--terra)';
      document.getElementById('uitnodigingBanner').textContent =
        'Deze uitnodigingslink is ongeldig of verlopen.';
      document.getElementById('registreerBtn').disabled = true;
    }
  }
})();

async function registreer() {
  const kantoorNaam = document.getElementById('kantoorNaam').value.trim();
  const naam        = document.getElementById('naam').value.trim();
  const email       = document.getElementById('email').value.trim();
  const wachtwoord  = document.getElementById('wachtwoord').value;
  const foutEl      = document.getElementById('fout');
  const okEl        = document.getElementById('ok');
  const btn         = document.getElementById('registreerBtn');

  foutEl.style.display = 'none';
  okEl.style.display   = 'none';

  // Validatie
  if (!_inviteOrgId && !kantoorNaam) {
    foutEl.textContent = 'Kies een naam voor je kantoor.';
    foutEl.style.display = 'block'; return;
  }
  if (!naam || !email || !wachtwoord) {
    foutEl.textContent = 'Vul alle velden in.';
    foutEl.style.display = 'block'; return;
  }
  if (wachtwoord.length < 8) {
    foutEl.textContent = 'Wachtwoord moet minimaal 8 tekens zijn.';
    foutEl.style.display = 'block'; return;
  }

  btn.disabled    = true;
  btn.textContent = 'Bezig…';

  try {
    let orgId = _inviteOrgId;
    const rol = _inviteOrgId ? _inviteRol : 'admin';

    if (!orgId) {
      // Nieuw kantoor aanmaken (server-side, omzeilt RLS)
      const orgRes  = await fetch('/api/registreer', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ kantoorNaam }),
      });
      const orgData = await orgRes.json();
      if (!orgRes.ok) throw new Error(orgData.error || 'Kantoor aanmaken mislukt.');
      orgId = orgData.organisatie_id;
    }

    // Gebruiker aanmaken (browser-side — trigger koppelt profiel aan org)
    const { error: authErr } = await db.auth.signUp({
      email,
      password: wachtwoord,
      options: { data: { naam, organisatie_id: orgId, rol } },
    });
    if (authErr) throw authErr;

    // Uitnodiging markeren als gebruikt
    if (_inviteToken) {
      await db.rpc('gebruik_uitnodiging', { p_token: _inviteToken });
    }

    okEl.textContent   = _inviteOrgId
      ? 'Account aangemaakt! Je wordt doorgestuurd naar de inlogpagina…'
      : 'Kantoor aangemeld! Je wordt doorgestuurd naar de inlogpagina…';
    okEl.style.display = 'block';
    setTimeout(() => window.location.replace('login.html'), 2000);

  } catch (e) {
    foutEl.textContent   = e.message || 'Registratie mislukt. Probeer opnieuw.';
    foutEl.style.display = 'block';
  } finally {
    btn.disabled    = false;
    btn.textContent = _inviteOrgId ? 'Account aanmaken' : 'Kantoor aanmelden';
  }
}

document.getElementById('registreerBtn').addEventListener('click', registreer);
document.addEventListener('keydown', e => { if (e.key === 'Enter') registreer(); });
</script>
</body>
</html>
